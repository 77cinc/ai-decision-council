<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>小红书封面</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+XiaoWei&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1440px;
    font-family: 'Noto Serif SC', serif;
    background: #0a0a12;
    overflow: hidden;
    position: relative;
  }

  /* 背景 */
  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(200,150,60,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 80%, rgba(60,120,200,0.05) 0%, transparent 50%);
  }

  /* 顶部标签 */
  .top-tag {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 30px;
    background: linear-gradient(135deg, #c23, #e04);
    border-radius: 30px;
    color: white;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 4px;
    box-shadow: 0 4px 20px rgba(200,30,60,0.4);
    z-index: 10;
  }

  /* 主标题区 */
  .title-area {
    position: absolute;
    top: 130px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
  }

  .main-title {
    font-size: 96px;
    font-weight: 900;
    letter-spacing: 20px;
    background: linear-gradient(135deg, #c4954a 0%, #f0d890 50%, #c4954a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 4px 8px rgba(196,149,74,0.3));
  }

  .sub-title {
    font-size: 32px;
    color: #8a8070;
    letter-spacing: 12px;
    margin-top: 10px;
  }

  /* 中间 - 票拟报告卡片 */
  .report-card {
    position: absolute;
    top: 360px;
    left: 80px;
    right: 80px;
    bottom: 280px;
    background: linear-gradient(135deg, #f5e6c8 0%, #e8d5a8 100%);
    border-radius: 20px;
    padding: 50px 45px;
    box-shadow:
      0 20px 80px rgba(0,0,0,0.5),
      0 0 0 1px rgba(196,149,74,0.3),
      inset 0 0 60px rgba(139,90,43,0.08);
    z-index: 10;
    overflow: hidden;
  }

  .report-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 32px,
      rgba(139,90,43,0.04) 32px, rgba(139,90,43,0.04) 33px
    );
    pointer-events: none;
  }

  .report-title {
    font-size: 36px;
    font-weight: 900;
    color: #2c1810;
    text-align: center;
    margin-bottom: 30px;
    letter-spacing: 6px;
  }

  .report-line {
    font-size: 22px;
    color: #3a2515;
    line-height: 2.2;
    padding-left: 10px;
    position: relative;
    z-index: 1;
  }

  .report-line.name {
    color: #8b3a1a;
    font-weight: 700;
    font-size: 24px;
    margin-top: 16px;
  }

  .report-highlight {
    background: rgba(139,90,43,0.1);
    padding: 4px 12px;
    border-radius: 4px;
    display: inline;
  }

  .report-ending {
    text-align: center;
    font-size: 28px;
    font-weight: 900;
    color: #2c1810;
    margin-top: 30px;
    letter-spacing: 8px;
    position: relative;
    z-index: 1;
  }

  /* 印章 */
  .seal {
    position: absolute;
    bottom: 40px;
    right: 35px;
    width: 90px;
    height: 90px;
    border: 4px solid #c23;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    color: #c23;
    font-weight: 900;
    transform: rotate(-12deg);
    opacity: 0.6;
    z-index: 2;
    letter-spacing: 2px;
    line-height: 1.2;
    text-align: center;
  }

  /* AI 元素 - 悬浮代码片段 */
  .code-float {
    position: absolute;
    background: rgba(26,27,38,0.95);
    border-radius: 10px;
    padding: 12px 16px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    color: #9ece6a;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.08);
    z-index: 15;
  }

  .code-float.top-right {
    top: 320px;
    right: 30px;
    transform: rotate(3deg);
  }

  .code-float.bottom-left {
    bottom: 200px;
    left: 30px;
    transform: rotate(-2deg);
    color: #7aa2f7;
  }

  .code-float .prompt { color: #9ece6a; }
  .code-float .cmd { color: #c0caf5; }
  .code-float .comment { color: #565f89; }

  /* 底部标语 */
  .bottom-text {
    position: absolute;
    bottom: 60px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 20;
  }

  .bottom-text .line1 {
    font-size: 36px;
    font-weight: 900;
    color: #e0dcd0;
    letter-spacing: 6px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  .bottom-text .line2 {
    font-size: 20px;
    color: #6b6558;
    margin-top: 8px;
    letter-spacing: 3px;
  }

  /* 角标 */
  .corner-badge {
    position: absolute;
    top: 50px;
    right: 50px;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1a1b26, #2a2b3e);
    border: 2px solid rgba(158,206,106,0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .corner-badge .num {
    font-size: 36px;
    font-weight: 900;
    color: #9ece6a;
    line-height: 1;
  }

  .corner-badge .unit {
    font-size: 13px;
    color: #565f89;
    margin-top: 2px;
  }
</style>
</head>
<body>
  <div class="bg"></div>

  <!-- 顶部标签 -->
  <div class="top-tag">🔥 开源免费</div>

  <!-- 角标 -->
  <div class="corner-badge">
    <span class="num">65</span>
    <span class="unit">位谋士</span>
  </div>

  <!-- 主标题 -->
  <div class="title-area">
    <div class="main-title">智囊团</div>
    <div class="sub-title">明朝内阁制 · AI 谋士系统</div>
  </div>

  <!-- 浮动代码 -->
  <div class="code-float top-right">
    <span class="prompt">❯</span> <span class="cmd">/council 降价应对</span><br>
    <span class="comment">→ 廷推中... 选出 5 位谋士</span>
  </div>

  <div class="code-float bottom-left">
    <span class="prompt">❯</span> <span class="cmd">批红：采甲策</span><br>
    <span class="comment">→ 已存档丝纶簿 #001</span>
  </div>

  <!-- 票拟报告 -->
  <div class="report-card">
    <div class="report-title">票拟存档 #001</div>

    <div class="report-line name">臣马云（首辅）谨奏：</div>
    <div class="report-line">臣等窃闻敌降价之事，</div>
    <div class="report-line">不可盲从，亦不可轻忽。</div>
    <div class="report-line" style="margin-top:20px">综合诸位所见，谨呈二策——</div>
    <div class="report-line" style="margin-top:16px">
      <span class="report-highlight"><b>甲策</b>：差异化突围</span>
    </div>
    <div class="report-line">
      <span class="report-highlight"><b>乙策</b>：集中兵力反击</span>
    </div>

    <div class="report-ending">恭请主公批红</div>

    <div class="seal">主公<br>批红</div>
  </div>

  <!-- 底部标语 -->
  <div class="bottom-text">
    <div class="line1">让 AI 谋士帮你出谋划策</div>
    <div class="line2">马云 · 诸葛亮 · 马斯克 · 韩非子 · 毛泽东 ...</div>
  </div>
</body>
</html>
